<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="start-screen screen-bg-start">
    <h1>Body Tracker</h1>
    <p>ابدا رحلتك دلوقتي وسجل بياناتك وخلي الكابتن مارك يساعدك توصل لافضل نسخة من نفسك</p>
    <button id="startBtn">start</button>
</div>
<section class="info-screen screen-bg-start">
    <h2>سجل بياناتك</h2>
    <input 
    type="text"
    id="name"
    placeholder="اكتب اسمك">
    <input 
    type="number"
    id="age"
    placeholder="السن">
    <input 
    type="number"
    id="height"
    placeholder= "الطول">
    <input 
    type="number"
    id="weight"
    placeholder= "الوزن">
    <select id="gender">
        <option value="">اختر النوع</option>
        <option>male</option>
        <option>female</option>
    </select>
    <select id="goal">
        <option value="">اختار هدفك</option>
        <option>خسارة وزن</option>
        <option>زيادة وزن</option>
        <option>تثبيت الوزن</option>
    </select>
    <select id="activity">
        <option value="">مستوي النشاط</option>
        <option>قليل</option>
        <option>متوسط</option>
        <option>عالي</option>
    </select>
    <button id="analyzeBtn">ابدا التحليل</button>
    
</section>
<div class="report-screen screen-bg-report" id="reportScreen">

    <!-- Dashboard -->
    <section class="tab active" id="dashboard">

        <div class="top-message">
            <p id="motivation"></p>
            <p id="reportAdvice"></p>
        </div>

        <div class="report-box">

            <p><strong>الاسم:</strong> <span id="reportName"></span></p>

            <p><strong>الطول:</strong> <span id="reportHeight"></span></p>

            <p><strong>الوزن:</strong> <span id="reportWeight"></span></p>

            <p><strong>BMI:</strong> <span id="reportBMI"></span></p>

            <div class="bmi-bar">
                <div id="bmiProgress"></div>
            </div>

            <p><strong>الحالة:</strong> <span id="reportStatus"></span></p>

            <p><strong>المياه:</strong> <span id="reportWater"></span></p>

            <p><strong>السعرات:</strong> <span id="reportCalories"></span></p>

            <p><strong>الخطوات:</strong> <span id="reportSteps"></span></p>

            <h3>🎯 التقدم</h3>

            <div class="goal-bar">
                <div id="goalProgress"></div>
            </div>

            <p id="goalPercent"></p>

        </div>

    </section>


    <section class="tab" id="plan">

        <div class="report-box screen-bg-plan">

            <p><strong>التمارين:</strong> <span id="reportWorkout"></span></p>

            <h3>الخطة الأسبوعية</h3>

            <ul id="weeklyPlan"></ul>

        </div>

    </section>


    <section class="tab" id="history">

        <div class="history-box screen-bg-history">

            <h3>سجل التحليلات</h3>

            <ul id="historyList"></ul>

        </div>

    </section>


    <section class="tab" id="settings">

        <div class="report-box screen-bg-settings">

            <p><strong>الهدف:</strong> <span id="reportGoal"></span></p>

            <button id="clearBtn">
                🗑️ مسح البيانات
            </button>

        </div>

    </section>


    <nav class="bottom-nav">

        <button class="nav-btn active" data-tab="dashboard">
            🏠
            <span>الرئيسية</span>
        </button>

        <button class="nav-btn" data-tab="plan">
            💪
            <span>الخطة</span>
        </button>

        <button class="nav-btn" data-tab="history">
            📈
            <span>السجل</span>
        </button>

        <button class="nav-btn" data-tab="settings">
            ⚙️
            <span>الإعدادات</span>
        </button>

    </nav>

</div>
    <script src="script.js"></script>
</body>
</html>
